<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CORS Test — Hello World</title>
</head>
<body>
  <h1>CORS Test Page</h1>
  <p>Calling <code>https://localhost:8080/message</code> from this page (hosted on GitHub Pages):</p>
  <p id="result">Loading...</p>

  <script>
    fetch('https://localhost:8080/message')
      .then(res => res.json())
      .then(data => {
        document.getElementById('result').textContent = data.message;
      })
      .catch(err => {
        document.getElementById('result').textContent = 'Error: ' + err.message;
      });
  </script>
</body>
</html>
